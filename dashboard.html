<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel · FIEL Microcrédito, E.I.</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variaveis.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/componentes.css">
<link rel="stylesheet" href="css/formularios.css">
<link rel="stylesheet" href="css/tabelas.css">
<link rel="stylesheet" href="css/modais.css">
<link rel="stylesheet" href="css/alertas.css">
<link rel="stylesheet" href="css/paginas.css">
</head>
<body>

<div class="app-shell">

  <div class="sobreposicao-lateral-movel" id="sobreposicao-lateral-movel"></div>

  <!-- ================= BARRA LATERAL ================= -->
  <aside class="lateral">
    <div class="lateral__cabecalho">
      <div class="lateral__logo-marca" data-config="logotipoUrl"><span class="lateral__logo-marca-texto">F</span></div>
      <span class="lateral__nome-empresa" data-config="nomeEmpresa">FIEL Microcrédito, E.I.</span>
    </div>

    <nav class="lateral__nav">
      <div class="lateral__secao-titulo">Principal</div>
      <a href="dashboard.html" class="item-menu" data-pagina="dashboard">
        <i class="fa-solid fa-gauge-high item-menu__icone"></i>
        <span class="item-menu__texto">Painel</span>
      </a>
      <a href="clientes.html" class="item-menu" data-pagina="clientes">
        <i class="fa-solid fa-users item-menu__icone"></i>
        <span class="item-menu__texto">Clientes</span>
      </a>
      <a href="emprestimos.html" class="item-menu" data-pagina="emprestimos">
        <i class="fa-solid fa-hand-holding-dollar item-menu__icone"></i>
        <span class="item-menu__texto">Empréstimos</span>
      </a>
      <a href="pagamentos.html" class="item-menu" data-pagina="pagamentos">
        <i class="fa-solid fa-money-bill-transfer item-menu__icone"></i>
        <span class="item-menu__texto">Pagamentos</span>
      </a>
      <a href="caixa.html" class="item-menu" data-pagina="caixa">
        <i class="fa-solid fa-cash-register item-menu__icone"></i>
        <span class="item-menu__texto">Caixa</span>
      </a>

      <div class="lateral__secao-titulo">Análise</div>
      <a href="relatorios.html" class="item-menu" data-pagina="relatorios">
        <i class="fa-solid fa-chart-line item-menu__icone"></i>
        <span class="item-menu__texto">Relatórios</span>
      </a>

      <div class="lateral__secao-titulo">Sistema</div>
      <a href="configuracoes.html" class="item-menu" data-pagina="configuracoes" data-somente-admin>
        <i class="fa-solid fa-gears item-menu__icone"></i>
        <span class="item-menu__texto">Configurações</span>
      </a>
    </nav>

    <div class="lateral__rodape">
      <button class="botao-recolher" id="botao-recolher-lateral" aria-label="Recolher menu">
        <i class="fa-solid fa-angles-left"></i>
      </button>
    </div>
  </aside>

  <!-- ================= BARRA SUPERIOR ================= -->
  <header class="topo">
    <div class="topo__esquerda">
      <button class="botao-menu-movel" id="botao-menu-movel" aria-label="Abrir menu">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="topo__pesquisa">
        <i class="fa-solid fa-magnifying-glass"></i>
        <label for="pesquisa-global-input" class="visualmente-oculto">Pesquisa global de clientes e contratos</label>
        <input type="text" id="pesquisa-global-input" placeholder="Pesquisar clientes, contratos...">
        <div id="pesquisa-global-resultados" class="oculto" style="position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--cor-neutro-0);border:1px solid var(--cor-borda);border-radius:var(--raio-md);box-shadow:var(--sombra-lg);max-height:360px;overflow-y:auto;z-index:var(--z-dropdown);"></div>
      </div>
    </div>
    <div class="topo__direita">
      <div class="topo__perfil">
        <div class="avatar-iniciais" data-utilizador-iniciais>--</div>
        <div class="topo__perfil-info">
          <span class="topo__perfil-nome" data-utilizador-nome>Carregando...</span>
          <span class="topo__perfil-cargo" data-utilizador-perfil>—</span>
        </div>
      </div>
      <button class="botao botao--icone botao--fantasma" data-acao-logout aria-label="Terminar sessão" title="Terminar sessão">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <!-- ================= CONTEÚDO ================= -->
  <main class="conteudo">

    <div class="pagina-cabecalho">
      <div>
        <h1 class="pagina-titulo">Painel Geral</h1>
        <p class="pagina-subtitulo" id="data-hoje-extenso">A carregar data...</p>
      </div>
      <div class="pagina-acoes">
        <button class="botao botao--secundario" id="botao-atualizar-dashboard">
          <i class="fa-solid fa-rotate-right"></i> Atualizar
        </button>
        <a href="emprestimos.html?novo=1" class="botao botao--primario">
          <i class="fa-solid fa-plus"></i> Novo Empréstimo
        </a>
      </div>
    </div>

    <!-- Cartões de indicadores -->
    <div class="grade-indicadores" id="grade-indicadores">
      <!-- Preenchido via JS -->
    </div>

    <div class="grade-perfil" style="grid-template-columns: 1fr 1fr;">

      <div class="cartao">
        <div class="cartao__cabecalho">
          <span class="cartao__titulo">Últimos Pagamentos</span>
          <a href="pagamentos.html" style="font-size:var(--tamanho-xs);">Ver todos</a>
        </div>
        <div class="lista-simples" id="lista-ultimos-pagamentos">
          <div class="linha-carregando-conteudo" style="padding:var(--espaco-6) 0;">
            <div class="girador girador--pequeno"></div> A carregar...
          </div>
        </div>
      </div>

      <div class="cartao">
        <div class="cartao__cabecalho">
          <span class="cartao__titulo">Próximos Vencimentos</span>
          <a href="emprestimos.html" style="font-size:var(--tamanho-xs);">Ver todos</a>
        </div>
        <div class="lista-simples" id="lista-proximos-vencimentos">
          <div class="linha-carregando-conteudo" style="padding:var(--espaco-6) 0;">
            <div class="girador girador--pequeno"></div> A carregar...
          </div>
        </div>
      </div>

    </div>

  </main>
</div>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/modal.js"></script>
<script src="js/layout.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
