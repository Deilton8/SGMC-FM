<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatórios · FIEL Microcrédito, E.I.</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variaveis.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/componentes.css">
<link rel="stylesheet" href="css/formularios.css">
<link rel="stylesheet" href="css/tabelas.css">
<link rel="stylesheet" href="css/modais.css">
<link rel="stylesheet" href="css/alertas.css">
<link rel="stylesheet" href="css/paginas.css">
</head>
<body>

<div class="app-shell">
  <div class="sobreposicao-lateral-movel" id="sobreposicao-lateral-movel"></div>

  <aside class="lateral">
    <div class="lateral__cabecalho">
      <div class="lateral__logo-marca" data-config="logotipoUrl"><span class="lateral__logo-marca-texto">F</span></div>
      <span class="lateral__nome-empresa" data-config="nomeEmpresa">FIEL Microcrédito, E.I.</span>
    </div>
    <nav class="lateral__nav">
      <div class="lateral__secao-titulo">Principal</div>
      <a href="dashboard.html" class="item-menu" data-pagina="dashboard"><i class="fa-solid fa-gauge-high item-menu__icone"></i><span class="item-menu__texto">Painel</span></a>
      <a href="clientes.html" class="item-menu" data-pagina="clientes"><i class="fa-solid fa-users item-menu__icone"></i><span class="item-menu__texto">Clientes</span></a>
      <a href="emprestimos.html" class="item-menu" data-pagina="emprestimos"><i class="fa-solid fa-hand-holding-dollar item-menu__icone"></i><span class="item-menu__texto">Empréstimos</span></a>
      <a href="pagamentos.html" class="item-menu" data-pagina="pagamentos"><i class="fa-solid fa-money-bill-transfer item-menu__icone"></i><span class="item-menu__texto">Pagamentos</span></a>
      <a href="caixa.html" class="item-menu" data-pagina="caixa"><i class="fa-solid fa-cash-register item-menu__icone"></i><span class="item-menu__texto">Caixa</span></a>
      <div class="lateral__secao-titulo">Análise</div>
      <a href="relatorios.html" class="item-menu" data-pagina="relatorios"><i class="fa-solid fa-chart-line item-menu__icone"></i><span class="item-menu__texto">Relatórios</span></a>
      <div class="lateral__secao-titulo">Sistema</div>
      <a href="configuracoes.html" class="item-menu" data-pagina="configuracoes" data-somente-admin><i class="fa-solid fa-gears item-menu__icone"></i><span class="item-menu__texto">Configurações</span></a>
    </nav>
    <div class="lateral__rodape">
      <button class="botao-recolher" id="botao-recolher-lateral" aria-label="Recolher menu"><i class="fa-solid fa-angles-left"></i></button>
    </div>
  </aside>

  <header class="topo">
    <div class="topo__esquerda">
      <button class="botao-menu-movel" id="botao-menu-movel" aria-label="Abrir menu"><i class="fa-solid fa-bars"></i></button>
      <div class="topo__pesquisa">
        <i class="fa-solid fa-magnifying-glass"></i>
        <label for="pesquisa-global-input" class="visualmente-oculto">Pesquisa global de clientes e contratos</label>
        <input type="text" id="pesquisa-global-input" placeholder="Pesquisar clientes, contratos...">
        <div id="pesquisa-global-resultados" class="oculto" style="position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--cor-neutro-0);border:1px solid var(--cor-borda);border-radius:var(--raio-md);box-shadow:var(--sombra-lg);max-height:360px;overflow-y:auto;z-index:var(--z-dropdown);"></div>
      </div>
    </div>
    <div class="topo__direita">
      <div class="topo__perfil">
        <div class="avatar-iniciais" data-utilizador-iniciais>--</div>
        <div class="topo__perfil-info">
          <span class="topo__perfil-nome" data-utilizador-nome>Carregando...</span>
          <span class="topo__perfil-cargo" data-utilizador-perfil>—</span>
        </div>
      </div>
      <button class="botao botao--icone botao--fantasma" data-acao-logout aria-label="Terminar sessão"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
  </header>

  <main class="conteudo">

    <div class="pagina-cabecalho">
      <div>
        <h1 class="pagina-titulo">Relatórios</h1>
        <p class="pagina-subtitulo">Consulte e exporte relatórios detalhados do sistema.</p>
      </div>
    </div>

    <div class="abas">
      <button class="aba-botao ativa" data-relatorio="clientes">Clientes</button>
      <button class="aba-botao" data-relatorio="emprestimos">Empréstimos</button>
      <button class="aba-botao" data-relatorio="caixa">Caixa</button>
      <button class="aba-botao" data-relatorio="pagamentos">Pagamentos</button>
      <button class="aba-botao" data-relatorio="inadimplentes">Inadimplentes</button>
      <button class="aba-botao" data-relatorio="financeiro">Financeiro</button>
    </div>

    <div class="cartao" style="margin-bottom: var(--espaco-5);">
      <div style="display:flex;align-items:center;gap:var(--espaco-4);flex-wrap:wrap;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:var(--espaco-3);flex-wrap:wrap;">
          <div class="campo-grupo" style="margin-bottom:0;">
            <label class="campo-rotulo">Data Início</label>
            <input type="date" id="relatorio-data-inicio" class="campo-entrada">
          </div>
          <div class="campo-grupo" style="margin-bottom:0;">
            <label class="campo-rotulo">Data Fim</label>
            <input type="date" id="relatorio-data-fim" class="campo-entrada">
          </div>
          <div class="campo-grupo" style="margin-bottom:0;">
            <label class="campo-rotulo">&nbsp;</label>
            <button class="botao botao--secundario" id="botao-gerar-relatorio"><i class="fa-solid fa-magnifying-glass"></i> Gerar Relatório</button>
          </div>
        </div>
        <div style="display:flex;gap:var(--espaco-2);">
          <button class="botao botao--secundario" id="botao-exportar-pdf"><i class="fa-solid fa-file-pdf"></i> Exportar PDF</button>
          <button class="botao botao--secundario" id="botao-exportar-excel"><i class="fa-solid fa-file-excel"></i> Exportar Excel</button>
        </div>
      </div>
    </div>

    <div class="grade-indicadores" id="relatorio-totais-grade" style="display:none;"></div>

    <div class="painel-tabela">
      <div class="painel-tabela__scroll">
        <table class="tabela-dados" id="tabela-relatorio">
          <thead id="tabela-relatorio-cabecalho"></thead>
          <tbody id="tabela-relatorio-corpo">
            <tr><td colspan="8"><div class="estado-vazio"><i class="fa-solid fa-chart-line"></i><div class="estado-vazio__titulo">Selecione um relatório</div><div class="estado-vazio__texto">Escolha uma categoria acima e clique em "Gerar Relatório".</div></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/modal.js"></script>
<script src="js/layout.js"></script>
<script src="js/relatorios.js"></script>
</body>
</html>
